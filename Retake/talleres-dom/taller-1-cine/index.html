<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Taller 1 — Mi Watchlist</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 3rem auto; padding: 0 1rem; background: #f4f5f7; color: #1c2430; }
    h1 { font-size: 1.5rem; }
    .fila { display: flex; gap: .5rem; margin: 1rem 0; }
    input { flex: 1; padding: .55rem .8rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    button { padding: .55rem 1rem; border: none; border-radius: 8px; background: #1c2430; color: white; font-weight: 600; cursor: pointer; }
    button:hover { opacity: .85; }
    .filtros button { background: #e2e5ea; color: #1c2430; }
    .filtros button.activo { background: #1c2430; color: white; }
    ul { list-style: none; padding: 0; }
    li { background: white; border: 1px solid #e2e5ea; border-radius: 8px; padding: .6rem .9rem; margin-bottom: .5rem; cursor: pointer; }
    li.vista { text-decoration: line-through; opacity: .55; }
    #resumen { color: #5a6675; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>🎬 Mi Watchlist</h1>
  <p id="resumen">...</p>

  <div class="fila">
    <input id="entrada" type="text" placeholder="Película por ver..." />
    <button id="btnAgregar">Agregar</button>
  </div>

  <div class="fila filtros">
    <button id="fTodas">Todas</button>
    <button id="fPendientes">Por ver</button>
    <button id="fVistas">Vistas</button>
  </div>

  <ul id="lista"></ul>

  <script src="app.js"></script>
</body>
</html>
