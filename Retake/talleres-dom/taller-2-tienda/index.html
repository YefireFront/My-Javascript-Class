<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Taller 2 — NBA Store</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; background: #f4f5f7; color: #1c2430; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.1rem; margin-top: 2rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; background: white; border: 1px solid #e2e5ea; border-radius: 8px; padding: .6rem .9rem; margin-bottom: .5rem; }
    button { padding: .35rem .8rem; border: none; border-radius: 8px; background: #1c2430; color: white; font-weight: 600; cursor: pointer; }
    button:hover { opacity: .85; }
    li button.quitar { background: #b42318; }
    #total { font-weight: 700; font-size: 1.05rem; }
  </style>
</head>
<body>
  <h1>🛒 NBA Store</h1>

  <h2>Productos</h2>
  <ul id="catalogo"></ul>

  <h2>Mi carrito</h2>
  <ul id="carrito"></ul>
  <p id="total">Total: $0</p>

  <script src="app.js"></script>
</body>
</html>
