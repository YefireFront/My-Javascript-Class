<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Taller 3 — Marcador NBA</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; background: #f4f5f7; color: #1c2430; text-align: center; }
    h1 { font-size: 1.5rem; }
    .tablero { display: flex; gap: 1rem; justify-content: center; margin: 1.5rem 0; }
    .equipo { background: white; border: 1px solid #e2e5ea; border-radius: 12px; padding: 1rem 1.5rem; flex: 1; }
    .equipo h2 { margin: 0; font-size: 1rem; }
    .puntos { font-size: 3rem; font-weight: 800; margin: .3rem 0; }
    button { padding: .45rem .9rem; border: none; border-radius: 8px; background: #1c2430; color: white; font-weight: 600; cursor: pointer; margin: .15rem; }
    button:hover { opacity: .85; }
    .controles button.peligro { background: #b42318; }
    #historial { list-style: none; padding: 0; text-align: left; color: #5a6675; font-size: .9rem; }
    #ganando { font-weight: 700; }
  </style>
</head>
<body>
  <h1>🏟️ Marcador</h1>
  <p id="ganando">...</p>

  <div class="tablero">
    <div class="equipo">
      <h2>LOCAL</h2>
      <div class="puntos" id="puntosLocal">0</div>
      <button data-equipo="local" data-valor="1">+1</button>
      <button data-equipo="local" data-valor="2">+2</button>
      <button data-equipo="local" data-valor="3">+3</button>
    </div>
    <div class="equipo">
      <h2>VISITANTE</h2>
      <div class="puntos" id="puntosVisita">0</div>
      <button data-equipo="visita" data-valor="1">+1</button>
      <button data-equipo="visita" data-valor="2">+2</button>
      <button data-equipo="visita" data-valor="3">+3</button>
    </div>
  </div>

  <div class="controles">
    <button id="btnDeshacer">↩ Deshacer</button>
    <button id="btnReiniciar" class="peligro">Reiniciar</button>
  </div>

  <h3>Historial</h3>
  <ul id="historial"></ul>

  <script src="app.js"></script>
</body>
</html>
