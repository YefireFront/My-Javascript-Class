<!DOCTYPE html>
<!-- ============================================================
  LECCIÓN 5 · PARTE HTML — léeme de arriba a abajo, está explicado
  HTML no es programación: son ETIQUETAS que describen qué hay en
  la página. <etiqueta>contenido</etiqueta>. Eso es todo.
============================================================ -->
<html lang="es">

<head>
  <!-- El <head> es config invisible: título de la pestaña, estilos... -->
  <meta charset="UTF-8" />
  <title>Lección 5 — Mi plantilla NBA</title>
  <style>
    /* CSS = la pinta. Hoy NO es el tema: está listo para que se vea bien. */
    body {
      font-family: system-ui, sans-serif;
      max-width: 540px;
      margin: 3rem auto;
      padding: 0 1rem;
      background: #f4f5f7;
      color: #1c2430;
    }
    h1 { font-size: 1.5rem; }
    .fila { display: flex; gap: .5rem; margin: 1rem 0; }
    input {
      flex: 1;
      padding: .55rem .8rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      padding: .55rem 1rem;
      border: none;
      border-radius: 8px;
      background: #1c2430;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { opacity: .85; }
    ul { list-style: none; padding: 0; }
    li {
      background: white;
      border: 1px solid #e2e5ea;
      border-radius: 8px;
      padding: .6rem .9rem;
      margin-bottom: .5rem;
      cursor: pointer;
    }
    /* Esta clase la usará tu JS: un jugador retirado se ve tachado */
    li.retirado { text-decoration: line-through; opacity: .55; }
    #contador { color: #5a6675; font-size: .9rem; }
  </style>
</head>

<body>
  <!-- El <body> es LO QUE SE VE. Cada etiqueta de aquí será un "nodo"
       del árbol DOM que tu JavaScript puede agarrar y cambiar.

       CLAVE: el atributo id="..." es el nombre propio de un elemento.
       Es el gancho que usará JS: document.querySelector("#lista") -->

  <h1>🏀 Mi plantilla NBA</h1>

  <!-- Un párrafo con id para que JS le escriba el conteo -->
  <p id="contador">...</p>

  <!-- input = caja de texto. button = botón. Los agrupo en un div (caja) -->
  <div class="fila">
    <input id="entrada" type="text" placeholder="Nombre del jugador..." />
    <button id="btnFichar">Fichar</button>
  </div>

  <!-- ul = lista. Está VACÍA a propósito: la llenará tu JavaScript -->
  <ul id="lista"></ul>

  <button id="btnLeyendas">⬇ Fichar leyendas (desde archivo)</button>

  <!-- El <script> carga tu JS. Va AL FINAL a propósito: así, cuando tu
       código corra, todas las etiquetas de arriba ya existen. Si fuera
       arriba, querySelector devolvería null (¡no existirían aún!) -->
  <script src="./app.js"></script>
</body>
</html>
